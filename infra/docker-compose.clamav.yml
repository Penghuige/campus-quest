# Separate scanner process; no access to application paths or credentials.
# docker compose -p campusquest-evidence -f infra/docker-compose.clamav.yml up -d
services:
  clamav:
    image: clamav/clamav:1.4.6@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    user: clamav
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "freshclam --config-file=/etc/clamav/freshclam.conf --daemon; exec clamd --foreground --config-file=/etc/clamav/clamd.conf"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-database:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "printf 'zPING\\0' | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
volumes:
  clamav-database:
