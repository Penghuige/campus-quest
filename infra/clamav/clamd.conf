# Application evidence cap is 10 MiB; daemon limits must never skip it.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogFile /tmp/clamd.log
MaxThreads 2
MaxQueue 4
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 50M
MaxScanTime 20000
MaxRecursion 8
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
ConcurrentDatabaseReload no
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 500
