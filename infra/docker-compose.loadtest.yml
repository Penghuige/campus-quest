# Loadtest-only compose overlay (plan Task 8, spec §Measurement):
# PostgreSQL slow-query logging without touching the shared compose
# file — `stack.sh` merges this file when it exists.
services:
  postgres:
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      # deadlock forensics (2026-10-31): full statement log lets us
      # reconstruct both transactions' lock-acquisition order after a
      # deadlock; lock waits over 1s are logged with both pids
      - -c
      - log_statement=all
      - -c
      - log_lock_waits=on
