# CampusQuest CI.
#
# Backend: lint (ruff), types (mypy strict on app), unit+worker tests,
# PostgreSQL/Redis/MinIO integration tests, and a clean-database Alembic
# upgrade + `alembic check` proving migrations match the models.
# Frontend: install, typecheck, lint, CSS integrity guard, unit tests,
# production build.
# Playwright is intentionally absent; it lands with the E2E plan (Plan 10).
#
# Triggers: pushes to main, plus pull requests targeting main. Working
# branches get CI through their PR (open the PR as a draft immediately);
# this avoids both hardcoded branch names and push+PR double runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    # Mirrors the integration-suite defaults in
    # backend/tests/integration/db_guard.py. The service port mappings below
    # publish PostgreSQL on localhost:15432 and Redis on localhost:6379, so
    # these values are what both the tests and `alembic` (through
    # app.core.config.get_settings) resolve. MinIO is published on
    # localhost:9000 and initialized in a later step.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:15432/campusquest_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: campusquest-test
      S3_ACCESS_KEY: campusquest
      S3_SECRET_KEY: campusquest-dev
      BUSINESS_TIMEZONE: Asia/Shanghai
      # Runs the real-S3 smoke (tests/integration/test_object_storage_smoke.py)
      # against the MinIO step container below; locally the same tests skip
      # without this flag.
      CQ_S3_SMOKE: "1"
      # Runs the production-composition smoke
      # (tests/integration/test_composition_smoke.py, G18) — the full
      # presign -> PUT -> finalize -> validation-job -> approve chain over
      # the real PostgreSQL/Redis/MinIO services above with no core
      # provider overridden; locally the same module skips without this
      # flag.
      CQ_COMPOSITION_SMOKE: "1"
      # Achievement evidence also exercises its real S3/ClamAV factories.
      CQ_EVIDENCE_SCAN_SMOKE: "1"

    services:
      postgres:
        # CI needs only the disposable test database, so the test role and
        # database that infra/postgres/init/10-test-databases.sh carves out
        # of the shared dev instance are created here directly through the
        # POSTGRES_* environment instead of the init script.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: campusquest_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d campusquest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked backend environment
        working-directory: backend
        run: uv sync --frozen

      - name: ruff format
        working-directory: backend
        run: uv run ruff format --check app tests alembic

      - name: ruff check
        working-directory: backend
        run: uv run ruff check app tests alembic

      - name: mypy (strict app)
        working-directory: backend
        run: uv run mypy

      # Contract-freshness gate, backend half (PR #4 review P1): the
      # committed openapi.snapshot.json must match what the CURRENT
      # backend serves. The frontend job regenerates the TS types from
      # the same snapshot — together the two halves make "green build
      # against a stale schema" impossible.
      - name: OpenAPI snapshot freshness
        working-directory: backend
        run: |
          uv run python scripts/dump_openapi.py ../frontend/openapi.snapshot.json
          git diff --exit-code ../frontend/openapi.snapshot.json

      # MinIO cannot be a job `services` entry: service containers cannot
      # override the image CMD, and this image's default CMD does not start
      # the server (infra/docker-compose.yml passes `server /data` too).
      # Same pinned image, credentials, and `mc ready local` healthcheck as
      # compose; started as a step container on localhost:9000 instead.
      #
      # The images load from the repo's own release assets
      # (tag ci-images-20260930): quay.io stopped serving anonymous pulls
      # for the minio namespace on ~2026-09-30, which broke every fresh
      # runner. The tarballs are byte-identical mirrors of the pinned
      # upstream tags and restore the original quay image names, so the
      # run commands below are unchanged.
      - name: Load pinned MinIO images from the release mirror
        run: |
          base="https://github.com/Penghuige/campus-quest/releases/download/ci-images-20260930"
          curl -fsSL "$base/cq-minio-server.tar.gz" | gunzip -c | docker load
          curl -fsSL "$base/cq-minio-mc.tar.gz"     | gunzip -c | docker load
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep minio
      - name: Start MinIO and wait until healthy
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=campusquest \
            -e MINIO_ROOT_PASSWORD=campusquest-dev \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3000 \
            --health-cmd 'mc ready local' \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' minio-ci)
            if [ "$status" = "healthy" ]; then
              echo "MinIO is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to become healthy:"
          docker logs minio-ci
          exit 1

      # Mirrors infra/docker-compose.yml's minio-init job: same pinned mc
      # image, alias setup, and idempotent bucket creation.
      - name: Create MinIO buckets
        run: |
          docker run --rm --network host --entrypoint sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set campusquest http://127.0.0.1:9000 campusquest campusquest-dev &&
             mc mb --ignore-existing campusquest/campusquest &&
             mc mb --ignore-existing campusquest/campusquest-test'

      - name: Start isolated evidence scanner and wait for readiness
        run: docker compose -p campusquest-evidence -f infra/docker-compose.clamav.yml up -d --wait --wait-timeout 360

      # Runs against the still-empty service database: proves a clean
      # database migrates from zero to head and that the committed
      # migrations match current models (no ungenerated migration).
      - name: Alembic upgrade from empty database + check
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # Dependency-vulnerability gate (owner-approved 2026-10-07):
      # pip-audit over the locked environment; accepted findings must
      # be rented in pip-audit-exemptions.json (reason + review date —
      # an expired exemption is itself a failure).
      - name: pip-audit gate
        working-directory: backend
        run: uv run python scripts/pip_audit_gate.py

      # Coverage runs alongside the suites (branch coverage on app/);
      # the two data files are combined and compared against the
      # committed ratchet after the last suite finishes.
      - name: Unit and worker tests
        working-directory: backend
        run: uv run pytest tests/unit tests/workers --cov=app --cov-branch --cov-report= --cov-append

      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration -m integration --cov=app --cov-branch --cov-report= --cov-append

      # The ratchet (owner-approved 2026-10-07): per-module branch
      # coverage floors in coverage-ratchet.json — any module below its
      # floor is red; raising floors is a deliberate --update commit
      # (scripts/coverage_ratchet.py), never automatic. The suites above
      # accumulate into one .coverage via --cov-append.
      - name: Coverage ratchet
        working-directory: backend
        run: uv run python scripts/coverage_ratchet.py

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Contract-freshness gate, frontend half (PR #4 review P1): the
      # committed schema.d.ts must be what the committed OpenAPI
      # snapshot generates — a hand-edited or stale type file fails
      # here instead of green-lighting a drifted integration.
      - name: Generated TS types freshness
        run: |
          npm run api:types:snapshot
          git diff --exit-code src/lib/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: CSS integrity
        run: npm run check:css

      - name: Unit tests
        run: npm run test:unit

      # P1 visibility: coverage ratchet (unit-suite scope — the floors
      # live in coverage-ratchet.json with the semantic boundary note)
      # and the npm audit gate (high/critical fail; exemptions with
      # reasons + re-review dates in scripts/npm-audit-exemptions.mjs).
      - name: Coverage ratchet
        run: npm run coverage:ratchet

      - name: npm audit gate
        run: npm run audit:gate

      - name: Production build
        run: npm run build

  # C3 promotion (plan-12 Phase C): the pixel suite proved stable
  # across repeated local runs; this job is the second runner
  # environment the plan demands before the gate promotion. Fonts are
  # pinned via the distro package so CJK rendering is deterministic;
  # retries are disabled for the visual suite in playwright.config so
  # a font-drift flake surfaces instead of retry-masking.
  visual-regression:
    name: Pixel visual regression (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: campusquest_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:15432/campusquest_test
      REDIS_URL: redis://localhost:6379/0
      # e2e-only https MinIO (:9002): P3-B pages are https, so presigned
      # URLs must be https too (mixed content otherwise). The config's
      # backendEnv pins the same endpoint + AWS_CA_BUNDLE; this block
      # keeps any direct backend invocation consistent.
      S3_ENDPOINT_URL: https://localhost:9002
      S3_BUCKET: campusquest-test
      S3_ACCESS_KEY: campusquest
      S3_SECRET_KEY: campusquest-dev
      BUSINESS_TIMEZONE: Asia/Shanghai
      CQ_E2E: "1"
      CQ_VISUAL: "1"
      CQ_E2E_FIXED_LABELS: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked backend environment
        working-directory: backend
        run: uv sync --frozen

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Deterministic CJK rendering: the baselines were shot against
      # fonts-noto-cjk 1:20230817+repack1-3 (font version 2.004) on the
      # dev box. ubuntu-latest's rolling install serves a newer repack
      # whose rasterization differs on dense text (the admin table shot
      # crossed the 1% ratio while 10 sparse pages absorbed it) — so the
      # EXACT version is pinned; a superseded archive version fails the
      # install loudly instead of drifting silently.
      - name: Pin CJK fonts (exact baseline version)
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            fonts-noto-cjk=1:20230817+repack1-3

      - name: Load pinned MinIO images from the release mirror
        run: |
          base="https://github.com/Penghuige/campus-quest/releases/download/ci-images-20260930"
          curl -fsSL "$base/cq-minio-server.tar.gz" | gunzip -c | docker load
          curl -fsSL "$base/cq-minio-mc.tar.gz"     | gunzip -c | docker load
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep minio
      # The e2e/visual stack is https (P3-B): the MinIO serving presigned
      # uploads must speak TLS on :9002 or the browser blocks the fetch
      # as mixed content. Same pinned server image; cert generated by
      # the repo's own script (infra/e2e-certs/ is gitignored).
      - name: Generate the e2e MinIO certificate
        run: bash infra/scripts/gen-e2e-minio-cert.sh
      - name: Start the https e2e MinIO and wait until live
        run: |
          docker run -d --name minio-e2e-ci \
            -p 9002:9000 \
            -e MINIO_ROOT_USER=campusquest \
            -e MINIO_ROOT_PASSWORD=campusquest-dev \
            -e MINIO_API_CORS_ALLOW_ORIGIN=https://localhost:3000,https://127.0.0.1:3000 \
            -v "$PWD/infra/e2e-certs/minio:/etc/minio/certs:ro" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --certs-dir /etc/minio/certs --address :9000 --console-address :9001
          for _ in $(seq 1 30); do
            if curl -skf https://localhost:9002/minio/health/live >/dev/null; then
              echo "e2e MinIO is live over https"
              exit 0
            fi
            sleep 2
          done
          echo "e2e MinIO failed to become live:"
          docker logs minio-e2e-ci
          exit 1
      - name: Create the e2e MinIO bucket
        run: |
          docker run --rm --network host \
            -e MINIO_ROOT_USER=campusquest \
            -e MINIO_ROOT_PASSWORD=campusquest-dev \
            --entrypoint sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'export MC_HOST_e2e="https://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@127.0.0.1:9002";
             mc --insecure mb --ignore-existing e2e/campusquest-test'

      - name: Migrate the service database
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Pixel visual regression (16 baselines, no regen)
        working-directory: frontend
        run: npm run test:e2e:visual

      # Use a separate world: granting an operator in the new visual spec
      # would otherwise change the old owner-profile baseline's identity.
      - name: Achievement review visual regression (3 baselines, no regen)
        working-directory: frontend
        run: npx playwright test innovation-review-visual.spec.ts --project=chromium

      # P3-A: the axe accessibility gate rides the same stack — the
      # 11-shot ratchet (new violations fail; baselined entries live in
      # e2e/a11y-baseline.ts with reasons and MUST stay reproducing).
      - name: Axe accessibility gate
        working-directory: frontend
        run: npm run test:e2e:a11y

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: frontend/test-results/
          retention-days: 7
