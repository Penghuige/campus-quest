[project]
name = "campusquest-backend"
version = "0.1.0"
description = "CampusQuest FastAPI backend (modular monolith)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "celery>=5.3",
    "boto3>=1.34",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "phonenumbers>=8.13",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
