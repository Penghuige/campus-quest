[project]
name = "campusquest-backend"
version = "0.1.0"
description = "CampusQuest FastAPI backend (modular monolith)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "celery>=5.3",
    "boto3>=1.34",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "regex>=2024.11.6",
    "pyjwt>=2.8",
    "cryptography>=43.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires a real PostgreSQL test database; select with 'pytest -m integration'",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # pep8-naming
    "UP",  # modernize syntax for py312
    "B",   # bugbear: likely bugs and design problems
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return style
]

[tool.mypy]
# Strict-first posture (docs/quality/backend-engineering.md §19): `app` (project
# code) is checked strictly and must stay clean; the pydantic.mypy plugin also
# resolves the BaseSettings call-arg errors strict mypy would otherwise report
# in app/core/config.py.
#
# Scope decision (task 8): the committed mypy 2.3.1 DOES parse the pytest 9.1.1
# sources (verified by running `uv run mypy --strict tests` -- the failures are
# semantic, not parse errors), so tests are excluded for these reasons instead:
# - boto3 and celery ship no py.typed, and tests import boto3 directly;
# - tests/integration relies on pytest inserting that directory into sys.path
#   at runtime for its sibling `db_guard` module, which static analysis cannot
#   see without layout changes;
# - pre-existing test helpers are un-annotated.
# Narrowing these is deferred until tests carry domain logic worth typing; do
# not widen this exclusion to app code.
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
# openpyxl 3.1.5 ships no py.typed (same situation as boto3/celery above);
# the XLSX validator (plan 04 task 5) drives it through `Any` boundaries.
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed either (see the tests-exclusion comment
# above); the S3 object-storage adapter (hardening P0-1) drives the client
# through the same `Any` boundary pattern.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
