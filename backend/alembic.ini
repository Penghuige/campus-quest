# backend/alembic.ini
# Alembic runs from backend/ (`cd backend && uv run alembic ...`).
[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is resolved at runtime from deployment settings
# (DATABASE_URL environment variable) in alembic/env.py; set sqlalchemy.url
# here only for an explicit one-off override.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
